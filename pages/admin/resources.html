<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --primary-dark: #0a192f;
    --primary-blue: #0f2b4c;
    --accent-gold: #f59e0b;
    --white: #ffffff;
    --off-white: #f8fafc;
    --text-gray: #64748b;
    --border-color: #e2e8f0;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans', sans-serif; color:var(--primary-dark); background:var(--off-white); line-height:1.6; }
h1,h2,h3 { font-family:'Playfair Display', serif; }
a { text-decoration:none; color:inherit; }
.page-body { padding: 2rem; }
@media (max-width: 768px) { .page-body { padding: 1.2rem; } }

        .admin-grid { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; }
        .admin-form-card, .admin-list-card {
            background: #fff; border-radius: 14px; padding: 1.6rem;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.05); border: 1px solid var(--border-color, #e2e8f0);
        }
        .admin-form-card h3, .admin-list-card h3 {
            font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--primary-dark, #0a192f); margin-bottom: 1.2rem;
        }
        .form-group { margin-bottom: 1.1rem; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--primary-dark, #0a192f); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.65rem 0.9rem; border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 8px; font-family: inherit; font-size: 0.9rem; background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .file-drop {
            border: 1.5px dashed var(--border-color, #e2e8f0); border-radius: 8px; padding: 1.2rem;
            text-align: center; font-size: 0.85rem; color: var(--text-gray, #64748b); cursor: pointer; position: relative;
        }
        .file-drop i { font-size: 1.3rem; color: #f59e0b; display: block; margin-bottom: 0.4rem; }
        .file-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-preview-name { font-size: 0.8rem; color: var(--primary-dark, #0a192f); margin-top: 0.5rem; font-weight: 600; }

        .btn-submit {
            width: 100%; padding: 0.85rem; background: var(--primary-dark, #0a192f); color: #fff;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-submit:hover { background: #f59e0b; color: var(--primary-dark, #0a192f); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .form-msg { font-size: 0.85rem; margin-bottom: 1rem; padding: 0.6rem 0.9rem; border-radius: 8px; display: none; }
        .form-msg.success { display: block; background: rgba(34,197,94,0.1); color: #15803d; }
        .form-msg.error { display: block; background: rgba(239,68,68,0.1); color: #dc2626; }

        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
        .resource-card { border: 1px solid var(--border-color, #e2e8f0); border-radius: 12px; padding: 1.2rem; position: relative; }
        .resource-icon {
            width: 42px; height: 42px; border-radius: 10px; background: rgba(139,92,246,0.12); color: #8b5cf6;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; margin-bottom: 0.9rem;
        }
        .resource-card h4 { font-size: 0.92rem; color: var(--primary-dark, #0a192f); margin-bottom: 0.3rem; }
        .resource-card p { font-size: 0.78rem; color: var(--text-gray, #64748b); margin-bottom: 0.5rem; }
        .resource-cat-tag {
            display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: capitalize;
            background: var(--off-white, #f8fafc); color: var(--primary-dark, #0a192f); padding: 0.2rem 0.6rem; border-radius: 20px;
        }
        .resource-delete-btn {
            position: absolute; top: 0.8rem; right: 0.8rem; background: rgba(239,68,68,0.1); color: #dc2626; border: none;
            width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 0.75rem;
        }
        .resource-delete-btn:hover { background: #dc2626; color: #fff; }

        @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
    
</style>
</head>
<body>
<main class="page-body">
                <div class="admin-grid">
                    <div class="admin-form-card">
                        <h3>Upload Resource</h3>
                        <div class="form-msg" id="formMsg"></div>

                        <form id="resourceForm">
                            <div class="form-group">
                                <label>Title</label>
                                <input type="text" id="resTitle" placeholder="e.g. Q4 Sabbath School Guide" required>
                            </div>

                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="resDescription" placeholder="Briefly describe this document..." required></textarea>
                            </div>

                            <div class="form-group">
                                <label>Category</label>
                                <select id="resCategory" required>
                                    <option value="lesson">Lesson</option>
                                    <option value="bible_study_guide">Bible Study Guide</option>
                                    <option value="sermon_notes">Sermon Notes</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Document File</label>
                                <div class="file-drop" id="fileDrop">
                                    <i class="fa-solid fa-file-arrow-up"></i>
                                    Click to upload document
                                    <input type="file" id="resFile" accept=".pdf,.doc,.docx,.ppt,.pptx">
                                </div>
                                <div class="file-preview-name" id="resFileName"></div>
                            </div>

                            <button type="submit" class="btn-submit" id="submitResBtn">Upload Resource</button>
                        </form>
                    </div>

                    <div class="admin-list-card">
                        <h3>All Resources</h3>
                        <div class="resource-grid" id="resourceGrid">
                            <p style="color:var(--text-gray,#64748b); font-size:0.9rem;">Loading...</p>
                        </div>
                    </div>
                </div>
            </main>
<script>
const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const categoryLabels = { lesson: 'Lesson', bible_study_guide: 'Bible Study Guide', sermon_notes: 'Sermon Notes', other: 'Other' };

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

document.getElementById('resFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    document.getElementById('resFileName').textContent = file ? file.name : '';
});

function showMsg(text, type) {
    const el = document.getElementById('formMsg');
    el.textContent = text;
    el.className = `form-msg ${type}`;
}

document.getElementById('resourceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitResBtn');
    const file = document.getElementById('resFile').files[0];
    if (!file) { showMsg('Please choose a document to upload.', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Uploading...';
    showMsg('', '');

    try {
        const title = document.getElementById('resTitle').value.trim();
        const description = document.getElementById('resDescription').value.trim();
        const category = document.getElementById('resCategory').value;
        const filePath = `${Date.now()}_${file.name}`;

        const { error: uploadError } = await supabaseClient.storage.from('resource-files').upload(filePath, file);
        if (uploadError) throw new Error('Upload failed: ' + uploadError.message);

        const { data: publicUrlData } = supabaseClient.storage.from('resource-files').getPublicUrl(filePath);

        const { error: insertError } = await supabaseClient.from('resources').insert({
            title, description, category, file_url: publicUrlData.publicUrl
        });
        if (insertError) throw new Error(insertError.message);

        showMsg('Resource uploaded successfully!', 'success');
        document.getElementById('resourceForm').reset();
        document.getElementById('resFileName').textContent = '';
        loadResources();
    } catch (err) {
        showMsg(err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Resource';
    }
});

async function deleteResource(id) {
    if (!confirm('Delete this resource?')) return;
    const { error } = await supabaseClient.from('resources').delete().eq('id', id);
    if (error) { alert('Could not delete: ' + error.message); return; }
    loadResources();
}

async function loadResources() {
    const container = document.getElementById('resourceGrid');
    const { data, error } = await supabaseClient.from('resources').select('*').order('created_at', { ascending: false });
    if (error) { container.innerHTML = `<p style="color:#dc2626; font-size:0.9rem;">${escapeHtml(error.message)}</p>`; return; }
    if (!data || data.length === 0) { container.innerHTML = '<p style="color:var(--text-gray,#64748b); font-size:0.9rem;">No resources uploaded yet.</p>'; return; }

    container.innerHTML = data.map(r => `
        <div class="resource-card">
            <button class="resource-delete-btn" onclick="deleteResource('${r.id}')"><i class="fa-solid fa-trash"></i></button>
            <div class="resource-icon"><i class="fa-solid fa-file-lines"></i></div>
            <h4>${escapeHtml(r.title)}</h4>
            <p>${escapeHtml(r.description)}</p>
            <span class="resource-cat-tag">${escapeHtml(categoryLabels[r.category] || r.category)}</span>
        </div>
    `).join('');
}

(async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.top.location.href = '../../auth.html'; return; }
    loadResources();
})();

</script>
</body>
</html>
