<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Transactions | Treasury Desk</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-blue: #0f2b4c;
            --accent-gold: #f59e0b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--primary-dark);
            background: var(--off-white);
            line-height: 1.6;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
        }

        .page-body {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .page-body {
                padding: 1rem;
            }
        }

        /* HEADER NAV */
        .page-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            background: #fff;
            padding: 0.6rem 1.1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .back-link:hover {
            background: var(--off-white);
            border-color: #cbd5e1;
        }

        /* CARD */
        .tr-card {
            background: #fff;
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .tr-card-header {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            margin-bottom: 1.4rem;
        }

        .tr-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
            background: var(--off-white);
            color: var(--primary-dark);
            border: 1px solid var(--border-color);
        }

        .tr-card-header h3 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 0.2rem;
        }

        .tr-card-header p {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .tr-card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tx-count-badge {
            background: var(--off-white);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.5rem 0.9rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1.3;
            white-space: nowrap;
        }

        .btn-export {
            background: var(--primary-dark);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-export:hover {
            background: #14243f;
        }

        /* TIME FILTER TOOLBAR */
        .filter-toolbar {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .filter-pills {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .filter-pill {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 0.45rem 1rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-gray);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-pill:hover {
            border-color: #cbd5e1;
            color: var(--primary-dark);
        }

        .filter-pill.active {
            background: var(--primary-dark);
            color: #fff;
            border-color: var(--primary-dark);
            box-shadow: 0 4px 10px rgba(10, 25, 47, 0.15);
        }

        .search-input-wrap {
            position: relative;
            width: 260px;
        }

        @media (max-width: 650px) {
            .search-input-wrap {
                width: 100%;
            }
        }

        .search-prefix {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-input-wrap input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fff;
            color: var(--primary-dark);
            transition: var(--transition);
        }

        .search-input-wrap input:focus {
            outline: none;
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.08);
        }

        /* ONE-LINE COMPACT TRANSACTION LIST ITEMS (Strictly enforced) */
        .tx-list-item {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: var(--off-white);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);

            /* Enforce single line layout on ALL devices */
            flex-wrap: nowrap !important;
            overflow: hidden;
            width: 100%;
        }

        .tx-list-item:hover {
            border-color: #cbd5e1;
            background: #fff;
        }

        .tx-list-item:last-child {
            margin-bottom: 0;
        }

        .tx-list-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.14);
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .tx-list-icon.initial {
            background: rgba(245, 158, 11, 0.14);
            color: var(--accent-gold);
        }

        .tx-list-body {
            flex: 1;
            min-width: 0;
            /* Critical for truncation */
        }

        .tx-list-body p {
            font-size: 0.84rem;
            color: var(--primary-dark);
            /* Truncate text */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        .tx-list-amount {
            text-align: right;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tx-list-amount .amt {
            font-weight: 800;
            color: #16a34a;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .tx-list-amount .amt.initial {
            color: var(--accent-gold);
        }

        .tx-list-amount .idx {
            font-size: 0.7rem;
            color: var(--text-gray);
            background: var(--white);
            border: 1px solid var(--border-color);
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .empty-tx {
            color: var(--text-gray);
            font-size: 0.9rem;
            text-align: center;
            padding: 3rem;
        }

        /* Mobile Specifics (No stacking for rows, just padding adjustments) */
        @media (max-width: 650px) {
            .tx-list-item {
                padding: 0.5rem 0.8rem;
                gap: 0.6rem;
            }

            .tx-list-body p {
                font-size: 0.78rem;
            }

            .tx-list-amount .amt {
                font-size: 0.85rem;
            }

            .tx-list-amount {
                gap: 6px;
            }
        }
    </style>
</head>

<body>
    <main class="page-body">

        <!-- NAV BAR -->
        <div class="page-header-bar">
            <a href="treasury.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Treasury Desk
            </a>
        </div>

        <!-- TRANSACTION LOGS CARD -->
        <div class="tr-card">
            <div class="tr-card-header tr-card-header-flex">
                <div style="display:flex; gap:1rem; align-items:flex-start;">
                    <div class="tr-icon"><i class="fa-solid fa-list-check"></i></div>
                    <div>
                        <h3>All Transaction Logs</h3>
                        <p>Complete historical archive of treasury deposits and balances.</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-export" onclick="exportTransactionsCSV()">
                        <i class="fa-solid fa-download"></i> Export CSV
                    </button>
                    <div class="tx-count-badge" id="txCountBadge">0<br>Transactions</div>
                </div>
            </div>

            <!-- TIME FILTERS & SEARCH -->
            <div class="filter-toolbar">
                <div class="filter-pills">
                    <button class="filter-pill active" onclick="setTimeFilter('all', this)">All Time</button>
                    <button class="filter-pill" onclick="setTimeFilter('24hrs', this)">24 hrs</button>
                    <button class="filter-pill" onclick="setTimeFilter('3days', this)">3 days</button>
                    <button class="filter-pill" onclick="setTimeFilter('7days', this)">7 days</button>
                    <button class="filter-pill" onclick="setTimeFilter('1month', this)">1 month</button>
                    <button class="filter-pill" onclick="setTimeFilter('1year', this)">1 year</button>
                </div>
                <div class="search-input-wrap">
                    <span class="search-prefix"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="txSearchInput" placeholder="Search member, amount or ID..."
                        oninput="renderTransactionList()">
                </div>
            </div>

            <div id="txLogList">
                <p class="empty-tx">Loading transactions...</p>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cachedTransactions = [];
        let currentTimeFilter = 'all';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatTimeLabel(dateInput) {
            return new Date(dateInput).toLocaleString('en-US', {
                hour: 'numeric', minute: '2-digit', hour12: true, month: 'short', day: 'numeric', year: 'numeric'
            });
        }

        function generateTransactionId(tx) {
            const dateObj = new Date(tx.created_at);
            const day = String(dateObj.getDate()).padStart(2, '0');
            let hash = 0;
            const str = tx.id || (tx.created_at + tx.amount);
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let randomPart = '';
            let seed = Math.abs(hash);
            for (let i = 0; i < 5; i++) {
                seed = (seed * 9301 + 49297) % 233280;
                const rnd = seed / 233280;
                randomPart += chars[Math.floor(rnd * chars.length)];
            }
            return `K${day}${randomPart}`;
        }

        function setTimeFilter(filterType, btn) {
            currentTimeFilter = filterType;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderTransactionList();
        }

        function renderTransactionList() {
            const container = document.getElementById('txLogList');
            const searchQuery = (document.getElementById('txSearchInput').value || '').toLowerCase();
            const now = new Date();

            const filtered = cachedTransactions.filter(tx => {
                const txDate = new Date(tx.created_at);
                const diffTime = now - txDate;

                let matchesTime = true;
                if (currentTimeFilter === '24hrs') {
                    matchesTime = diffTime <= (24 * 60 * 60 * 1000);
                } else if (currentTimeFilter === '3days') {
                    matchesTime = diffTime <= (3 * 24 * 60 * 60 * 1000);
                } else if (currentTimeFilter === '7days') {
                    matchesTime = diffTime <= (7 * 24 * 60 * 60 * 1000);
                } else if (currentTimeFilter === '1month') {
                    matchesTime = diffTime <= (30 * 24 * 60 * 60 * 1000);
                } else if (currentTimeFilter === '1year') {
                    matchesTime = diffTime <= (365 * 24 * 60 * 60 * 1000);
                }

                const name = (tx.profiles && tx.profiles.full_name ? tx.profiles.full_name : 'Initial Baseline').toLowerCase();
                const amtStr = String(tx.amount);
                const txId = generateTransactionId(tx).toLowerCase();
                const matchesSearch = !searchQuery || name.includes(searchQuery) || amtStr.includes(searchQuery) || tx.type.includes(searchQuery) || txId.includes(searchQuery);

                return matchesTime && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-tx">No matching transactions found.</p>';
                return;
            }

            container.innerHTML = filtered.map(tx => {
                const isInitial = tx.type === 'initial';
                const name = isInitial ? 'Initial Baseline' : (tx.profiles && tx.profiles.full_name ? tx.profiles.full_name : 'a member');
                const timeLabel = formatTimeLabel(tx.created_at);
                const txId = generateTransactionId(tx);

                const formattedAmount = `KSh ${Number(tx.amount).toLocaleString()}`;
                const textDesc = isInitial
                    ? `Initial treasury pool established at ${formattedAmount} on ${timeLabel}. (${txId})`
                    : `successfully deposited ${formattedAmount} to ${escapeHtml(name)} on ${timeLabel}. Transaction ID ${txId}`;

                return `
                    <div class="tx-list-item" title="${escapeHtml(textDesc)}">
                        <div class="tx-list-icon ${isInitial ? 'initial' : ''}">
                            <i class="fa-solid ${isInitial ? 'fa-coins' : 'fa-arrow-down'}"></i>
                        </div>
                        <div class="tx-list-body">
                            <p>${escapeHtml(textDesc)}</p>
                        </div>
                        <div class="tx-list-amount">
                            <div class="amt ${isInitial ? 'initial' : ''}">${isInitial ? '' : '+'}${formattedAmount}</div>
                            <div class="idx">#${tx.num}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadAllTransactions() {
            const { data: txData, error: txError } = await supabaseClient
                .from('transactions')
                .select('*, profiles:user_id(full_name)')
                .order('created_at', { ascending: false });

            const container = document.getElementById('txLogList');
            if (txError) {
                container.innerHTML = `<p class="empty-tx" style="color:#dc2626;">${escapeHtml(txError.message)}</p>`;
                return;
            }

            const rawTransactions = txData || [];
            document.getElementById('txCountBadge').innerHTML = `${rawTransactions.length}<br>Transaction${rawTransactions.length === 1 ? '' : 's'}`;

            const numbered = rawTransactions
                .slice()
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
                .map((tx, idx) => ({ ...tx, num: idx + 1 }));

            cachedTransactions = numbered.slice().reverse();
            renderTransactionList();
        }

        function exportTransactionsCSV() {
            if (!cachedTransactions.length) {
                alert('No transactions available to export.');
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Transaction ID,Type,Member/Details,Amount (KSh),Timestamp\r\n";
            cachedTransactions.forEach(tx => {
                const name = tx.type === 'initial' ? 'Initial Balance' : (tx.profiles?.full_name || 'Member');
                csvContent += `"${generateTransactionId(tx)}","${tx.type}","${name.replace(/"/g, '""')}","${tx.amount}","${tx.created_at}"\r\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `all_treasury_logs_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.top.location.href = '../auth.html';
                return;
            }
            await loadAllTransactions();
        })();
    </script>
</body>

</html>
