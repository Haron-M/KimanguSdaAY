<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasury Desk</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-blue: #0f2b4c;
            --accent-gold: #f59e0b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--primary-dark);
            background: var(--off-white);
            line-height: 1.6;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page-body {
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .page-body {
                padding: 1.2rem;
            }
        }

        .coming-soon {
            background: #fff;
            border-radius: 14px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.05);
            border: 1px solid var(--border-color, #e2e8f0);
        }

        .coming-soon i {
            font-size: 2.2rem;
            color: #f59e0b;
            margin-bottom: 1rem;
        }

        .coming-soon h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-dark, #0a192f);
            margin-bottom: 0.6rem;
            font-size: 1.3rem;
        }

        .coming-soon p {
            color: var(--text-gray, #64748b);
            font-size: 0.95rem;
            max-width: 420px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <main class="page-body">
        <div class="coming-soon">
            <i class="fa-solid fa-coins"></i>
            <h3>Treasury Desk</h3>
            <p>This page will show your account balance, contribution history, and payment options. Let me know what
                should appear here and I'll build it out.</p>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.top.location.href = '../auth.html'; return; }
        })();

    </script>
</body>

</html>
