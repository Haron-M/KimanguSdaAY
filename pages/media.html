<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-blue: #0f2b4c;
            --accent-gold: #f59e0b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--primary-dark);
            background: var(--off-white);
            line-height: 1.6;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page-body {
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .page-body {
                padding: 1.2rem;
            }
        }

        .filter-tabs {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .filter-tab {
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color, #e2e8f0);
            color: var(--text-gray, #64748b);
            background: #fff;
        }

        .filter-tab.active {
            background: var(--primary-dark, #0a192f);
            color: #fff;
            border-color: var(--primary-dark, #0a192f);
        }

        .media-public-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .media-public-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.05);
            border: 1px solid var(--border-color, #e2e8f0);
        }

        .media-public-top {
            height: 160px;
            background: linear-gradient(135deg, var(--primary-dark, #0a192f), var(--primary-blue, #0f2b4c));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f59e0b;
            font-size: 2.4rem;
            position: relative;
        }

        .media-public-type {
            position: absolute;
            top: 0.8rem;
            left: 0.8rem;
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-dark, #0a192f);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
        }

        .media-public-body {
            padding: 1.2rem;
        }

        .media-public-body h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            color: var(--primary-dark, #0a192f);
            margin-bottom: 0.4rem;
        }

        .media-public-body p {
            font-size: 0.85rem;
            color: var(--text-gray, #64748b);
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }

        .media-public-body span {
            font-size: 0.75rem;
            color: var(--text-gray, #64748b);
        }

        .media-play-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-dark, #0a192f);
            text-decoration: none;
            margin-top: 0.6rem;
        }

        .media-play-link:hover {
            color: #f59e0b;
        }

        .empty-msg {
            color: var(--text-gray, #64748b);
            font-size: 0.95rem;
            text-align: center;
            padding: 3rem;
            grid-column: 1/-1;
        }
    </style>
</head>

<body>
    <main class="page-body">
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All</div>
            <div class="filter-tab" data-filter="video" onclick="setFilter('video')">Videos</div>
            <div class="filter-tab" data-filter="song" onclick="setFilter('song')">Songs</div>
        </div>

        <div class="media-public-grid" id="mediaPublicGrid">
            <p class="empty-msg">Loading media...</p>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allMedia = [];
        let currentFilter = 'all';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function timeAgo(dateStr) {
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 60) return `${mins} min${mins === 1 ? '' : 's'} ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
            const days = Math.floor(hrs / 24);
            if (days < 30) return `${days} day${days === 1 ? '' : 's'} ago`;
            return new Date(dateStr).toLocaleDateString();
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === type));
            renderMedia();
        }

        function renderMedia() {
            const container = document.getElementById('mediaPublicGrid');
            const items = currentFilter === 'all' ? allMedia : allMedia.filter(m => m.type === currentFilter);

            if (items.length === 0) {
                container.innerHTML = '<p class="empty-msg">No media found in this category yet.</p>';
                return;
            }

            container.innerHTML = items.map(m => `
        <div class="media-public-card">
            <div class="media-public-top">
                <span class="media-public-type">${escapeHtml(m.type)}</span>
                <i class="fa-solid ${m.type === 'video' ? 'fa-circle-play' : 'fa-music'}"></i>
            </div>
            <div class="media-public-body">
                <h4>${escapeHtml(m.title)}</h4>
                <p>${escapeHtml(m.description)}</p>
                <span>${timeAgo(m.created_at)}</span><br>
                <a href="${m.file_url}" target="_blank" class="media-play-link">
                    <i class="fa-solid ${m.type === 'video' ? 'fa-play' : 'fa-headphones'}"></i>
                    ${m.type === 'video' ? 'Watch now' : 'Listen now'}
                </a>
            </div>
        </div>
    `).join('');
        }

        async function loadMedia() {
            const { data, error } = await supabaseClient.from('media').select('*').order('created_at', { ascending: false });
            if (error) {
                document.getElementById('mediaPublicGrid').innerHTML = `<p class="empty-msg">Could not load media: ${escapeHtml(error.message)}</p>`;
                return;
            }
            allMedia = data || [];
            renderMedia();
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.top.location.href = '../auth.html'; return; }
            loadMedia();
        })();

    </script>
</body>

</html>
