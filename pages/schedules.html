<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedules</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-blue: #0f2b4c;
            --accent-gold: #f59e0b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--primary-dark);
            background: var(--off-white);
            line-height: 1.6;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Playfair Display', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page-body {
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .page-body {
                padding: 1.2rem;
            }
        }

        /* Top Header Area */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h2 {
            font-size: 1.8rem;
            color: var(--primary-dark);
        }

        .btn-add-top {
            display: none;
            /* Shown dynamically when >= 2 schedules */
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-dark);
            color: #ffffff;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-add-top:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
        }

        /* Schedule Grid Layout */
        .schedule-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 1.5rem;
            align-items: start;
            transition: var(--transition);
        }

        .schedule-grid.full-width {
            grid-template-columns: 1fr;
        }

        .form-card,
        .list-card {
            background: #fff;
            border-radius: 14px;
            padding: 1.6rem;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.05);
            border: 1px solid var(--border-color);
        }

        .form-card h3,
        .list-card h3 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--primary-dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fff;
            color: var(--primary-dark);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-dark);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Schedule List & Cards */
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            background: var(--off-white);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-gray);
            transition: var(--transition);
        }

        .tab-btn.active,
        .tab-btn:hover {
            background: var(--primary-dark);
            color: #fff;
            border-color: var(--primary-dark);
        }

        .schedule-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .schedule-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.1rem;
            position: relative;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .schedule-card:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(10, 25, 47, 0.06);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 0.6rem;
        }

        .category-tag {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .cat-worship {
            background: rgba(245, 158, 11, 0.15);
            color: #b45309;
        }

        .cat-duty {
            background: rgba(59, 130, 246, 0.15);
            color: #1d4ed8;
        }

        .cat-meeting {
            background: rgba(139, 92, 246, 0.15);
            color: #6d28d9;
        }

        .cat-personal {
            background: rgba(34, 197, 94, 0.15);
            color: #15803d;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.2rem;
            opacity: 0.7;
            transition: var(--transition);
        }

        .btn-delete:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .schedule-title {
            font-size: 1.05rem;
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .schedule-desc {
            font-size: 0.82rem;
            color: var(--text-gray);
            margin-bottom: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.8rem;
            color: var(--primary-blue);
            border-top: 1px dashed var(--border-color);
            padding-top: 0.6rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .meta-item i {
            color: var(--accent-gold);
            width: 14px;
        }

        /* Dynamic Centered Mobile Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(10, 25, 47, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease-in-out;
            padding: 1.2rem;
            overflow-y: auto;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Scrollable Modal Card Fix */
        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.2rem 1.8rem;
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.9);
            transition: all 0.25s ease-in-out;
            border: 1px solid var(--border-color);
            margin: auto;
        }

        /* Clean Scrollbars for Modal Card */
        .modal-card::-webkit-scrollbar {
            width: 6px;
        }

        .modal-card::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .modal-card::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        /* Form Modal Customization */
        .modal-card.modal-form-card {
            max-width: 460px;
            text-align: left;
            padding: 2rem 1.8rem;
            transition: max-width 0.3s ease;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 2;
            padding-bottom: 0.5rem;
        }

        .modal-header h4 {
            font-size: 1.25rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            color: var(--text-gray);
            cursor: pointer;
            transition: var(--transition);
        }

        .close-modal-btn:hover {
            color: var(--primary-dark);
        }

        /* Horizontal Modal Layout for Desktop / Large Screens */
        @media (min-width: 768px) {
            .modal-card.modal-form-card {
                max-width: 720px;
            }

            .modal-form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem 1.2rem;
                align-items: start;
            }

            .modal-form-grid .full-width {
                grid-column: span 2;
            }
        }

        /* Bold Icon Circle Sizing */
        .modal-icon-wrapper {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
            font-size: 2.4rem;
        }

        .modal-icon-wrapper i {
            font-weight: 900;
            -webkit-text-stroke: 1.5px currentColor;
        }

        .modal-icon-wrapper.success {
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
        }

        .modal-icon-wrapper.warning {
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
        }

        .modal-card h4.status-title {
            font-size: 1.25rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .modal-card p.status-msg {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .modal-btn {
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
        }

        .modal-btn-primary {
            background: var(--primary-dark);
            color: #ffffff;
        }

        .modal-btn-primary:hover {
            background: var(--primary-blue);
        }

        .modal-btn-danger {
            background: #dc2626;
            color: #ffffff;
        }

        .modal-btn-danger:hover {
            background: #b91c1c;
        }

        .modal-btn-cancel {
            background: var(--off-white);
            color: var(--text-gray);
            border: 1px solid var(--border-color);
        }

        .modal-btn-cancel:hover {
            background: var(--border-color);
            color: var(--primary-dark);
        }

        @media (max-width: 900px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="page-body">
        <div class="page-header">
            <h2>Schedules</h2>
            <button type="button" class="btn-add-top" id="topAddBtn" onclick="openAddModal()">
                <i class="fa-solid fa-plus"></i> Add Schedule
            </button>
        </div>

        <div class="schedule-grid" id="scheduleGrid">
            <!-- Inline Create Schedule Form (Visible when schedules < 2) -->
            <div class="form-card" id="inlineFormCard">
                <h3>Add Schedule</h3>

                <form id="inlineScheduleForm">
                    <div class="form-group">
                        <label for="schedTitle">Event Title</label>
                        <input type="text" id="schedTitle" placeholder="e.g. Choir Practice / Usher Duty" required>
                    </div>

                    <div class="form-group">
                        <label for="schedCategory">Category</label>
                        <select id="schedCategory" required>
                            <option value="worship">Worship / Service</option>
                            <option value="duty">Duty Roster</option>
                            <option value="meeting">Meeting</option>
                            <option value="personal">Personal Study</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="schedDate">Date</label>
                        <input type="date" id="schedDate" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="schedStartTime">Start Time</label>
                            <input type="time" id="schedStartTime" required>
                        </div>
                        <div class="form-group">
                            <label for="schedEndTime">End Time</label>
                            <input type="time" id="schedEndTime">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="schedLocation">Location (Optional)</label>
                        <input type="text" id="schedLocation" placeholder="e.g. Main Sanctuary / Zoom">
                    </div>

                    <div class="form-group">
                        <label for="schedDesc">Description (Optional)</label>
                        <textarea id="schedDesc" placeholder="Notes or special instructions..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="inlineSubmitBtn">Save Schedule</button>
                </form>
            </div>

            <!-- Schedules Listing -->
            <div class="list-card">
                <div class="list-header">
                    <h3>My Schedules</h3>
                    <div class="filter-tabs">
                        <button type="button" class="tab-btn active" onclick="filterSchedules('all', this)">All</button>
                        <button type="button" class="tab-btn"
                            onclick="filterSchedules('upcoming', this)">Upcoming</button>
                        <button type="button" class="tab-btn" onclick="filterSchedules('past', this)">Past</button>
                    </div>
                </div>

                <div class="schedule-items" id="scheduleList">
                    <p style="color:var(--text-gray); font-size:0.9rem;">Loading your schedules...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Scrollable Horizontal Popup Modal Form -->
    <div class="modal-overlay" id="addScheduleModal">
        <div class="modal-card modal-form-card">
            <div class="modal-header">
                <h4>Add Schedule</h4>
                <button type="button" class="close-modal-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="modalScheduleForm">
                <div class="modal-form-grid">
                    <div class="form-group">
                        <label for="modalSchedTitle">Event Title</label>
                        <input type="text" id="modalSchedTitle" placeholder="e.g. Choir Practice / Usher Duty" required>
                    </div>

                    <div class="form-group">
                        <label for="modalSchedCategory">Category</label>
                        <select id="modalSchedCategory" required>
                            <option value="worship">Worship / Service</option>
                            <option value="duty">Duty Roster</option>
                            <option value="meeting">Meeting</option>
                            <option value="personal">Personal Study</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="modalSchedDate">Date</label>
                        <input type="date" id="modalSchedDate" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="modalSchedStartTime">Start Time</label>
                            <input type="time" id="modalSchedStartTime" required>
                        </div>
                        <div class="form-group">
                            <label for="modalSchedEndTime">End Time</label>
                            <input type="time" id="modalSchedEndTime">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="modalSchedLocation">Location (Optional)</label>
                        <input type="text" id="modalSchedLocation" placeholder="e.g. Main Sanctuary / Zoom">
                    </div>

                    <div class="form-group full-width">
                        <label for="modalSchedDesc">Description (Optional)</label>
                        <textarea id="modalSchedDesc" placeholder="Notes or special instructions..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="modalSubmitBtn">Save Schedule</button>
            </form>
        </div>
    </div>

    <!-- Status / Confirmation Popup Modal Overlay -->
    <div class="modal-overlay" id="popupModal">
        <div class="modal-card">
            <div class="modal-icon-wrapper" id="modalIcon"></div>
            <h4 class="status-title" id="modalTitle">Header</h4>
            <p class="status-msg" id="modalMessage">Message content goes here.</p>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;
        let allSchedules = [];
        let activeFilter = 'all';

        const categoryMap = {
            worship: { label: 'Worship', class: 'cat-worship' },
            duty: { label: 'Duty Roster', class: 'cat-duty' },
            meeting: { label: 'Meeting', class: 'cat-meeting' },
            personal: { label: 'Personal', class: 'cat-personal' }
        };

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':');
            const h = parseInt(hours, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const formattedH = h % 12 || 12;
            return `${formattedH}:${minutes} ${ampm}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        /* --- Dynamic Popup Modal Helpers --- */
        const modalOverlay = document.getElementById('popupModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalActions = document.getElementById('modalActions');

        const addScheduleModal = document.getElementById('addScheduleModal');

        function openAddModal() {
            addScheduleModal.classList.add('active');
        }

        function closeAddModal() {
            addScheduleModal.classList.remove('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function showSuccessModal(message) {
            modalIcon.className = 'modal-icon-wrapper success';
            modalIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            modalTitle.textContent = 'Success!';
            modalMessage.textContent = message;
            modalActions.innerHTML = `
                <button type="button" class="modal-btn modal-btn-primary" onclick="closeModal()">OK</button>
            `;
            modalOverlay.classList.add('active');
        }

        function showConfirmDeleteModal(onConfirm) {
            modalIcon.className = 'modal-icon-wrapper warning';
            modalIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            modalTitle.textContent = 'Confirm Delete';
            modalMessage.textContent = 'Are you sure you want to delete this schedule?';

            modalActions.innerHTML = `
                <button type="button" class="modal-btn modal-btn-cancel" id="btnCancelModal">Cancel</button>
                <button type="button" class="modal-btn modal-btn-danger" id="btnConfirmModal">Yes, Delete</button>
            `;

            document.getElementById('btnCancelModal').onclick = closeModal;
            document.getElementById('btnConfirmModal').onclick = () => {
                closeModal();
                onConfirm();
            };

            modalOverlay.classList.add('active');
        }

        function showErrorModal(message) {
            modalIcon.className = 'modal-icon-wrapper warning';
            modalIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
            modalTitle.textContent = 'Error';
            modalMessage.textContent = message;
            modalActions.innerHTML = `
                <button type="button" class="modal-btn modal-btn-primary" onclick="closeModal()">Close</button>
            `;
            modalOverlay.classList.add('active');
        }

        // Close modal overlays when clicking background
        [modalOverlay, addScheduleModal].forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        });

        /* --- UI State Manager: Toggle Inline Form vs Top Button based on schedule count --- */
        function updateLayoutState() {
            const inlineFormCard = document.getElementById('inlineFormCard');
            const scheduleGrid = document.getElementById('scheduleGrid');
            const topAddBtn = document.getElementById('topAddBtn');

            if (allSchedules.length >= 2) {
                inlineFormCard.style.display = 'none';
                scheduleGrid.classList.add('full-width');
                topAddBtn.style.display = 'inline-flex';
            } else {
                inlineFormCard.style.display = 'block';
                scheduleGrid.classList.remove('full-width');
                topAddBtn.style.display = 'none';
            }
        }

        /* --- Shared Schedule Creation Handler --- */
        async function handleScheduleSubmit(payload, submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            try {
                const { error } = await supabaseClient.from('schedules').insert({
                    user_id: currentUserId,
                    ...payload
                });

                if (error) throw new Error(error.message);

                closeAddModal();
                showSuccessModal('Schedule added successfully');

                document.getElementById('inlineScheduleForm').reset();
                document.getElementById('modalScheduleForm').reset();

                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('schedDate').value = todayStr;
                document.getElementById('modalSchedDate').value = todayStr;

                fetchSchedules();
            } catch (err) {
                showErrorModal(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Schedule';
            }
        }

        // Inline Form Listener
        document.getElementById('inlineScheduleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('schedTitle').value.trim(),
                category: document.getElementById('schedCategory').value,
                event_date: document.getElementById('schedDate').value,
                start_time: document.getElementById('schedStartTime').value,
                end_time: document.getElementById('schedEndTime').value || null,
                location: document.getElementById('schedLocation').value.trim() || null,
                description: document.getElementById('schedDesc').value.trim() || null
            };
            handleScheduleSubmit(payload, document.getElementById('inlineSubmitBtn'));
        });

        // Modal Form Listener
        document.getElementById('modalScheduleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('modalSchedTitle').value.trim(),
                category: document.getElementById('modalSchedCategory').value,
                event_date: document.getElementById('modalSchedDate').value,
                start_time: document.getElementById('modalSchedStartTime').value,
                end_time: document.getElementById('modalSchedEndTime').value || null,
                location: document.getElementById('modalSchedLocation').value.trim() || null,
                description: document.getElementById('modalSchedDesc').value.trim() || null
            };
            handleScheduleSubmit(payload, document.getElementById('modalSubmitBtn'));
        });

        /* --- Delete Schedule Handler --- */
        function deleteSchedule(id) {
            showConfirmDeleteModal(async () => {
                const { error } = await supabaseClient.from('schedules').delete().eq('id', id);
                if (error) {
                    showErrorModal('Could not delete schedule: ' + error.message);
                    return;
                }
                fetchSchedules();
            });
        }

        function filterSchedules(filterType, btnEl) {
            activeFilter = filterType;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            renderSchedules();
        }

        function renderSchedules() {
            const container = document.getElementById('scheduleList');
            const todayStr = new Date().toISOString().split('T')[0];

            let filtered = allSchedules.filter(item => {
                if (activeFilter === 'upcoming') return item.event_date >= todayStr;
                if (activeFilter === 'past') return item.event_date < todayStr;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color:var(--text-gray); font-size:0.9rem;">No ${activeFilter !== 'all' ? activeFilter : ''} schedules found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(s => {
                const catInfo = categoryMap[s.category] || { label: s.category, class: 'cat-meeting' };
                const timeText = s.end_time
                    ? `${formatTime(s.start_time)} - ${formatTime(s.end_time)}`
                    : formatTime(s.start_time);

                return `
                    <div class="schedule-card">
                        <div>
                            <div class="card-top">
                                <span class="category-tag ${catInfo.class}">${escapeHtml(catInfo.label)}</span>
                                <button class="btn-delete" onclick="deleteSchedule('${s.id}')" title="Delete Schedule">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                            <h4 class="schedule-title">${escapeHtml(s.title)}</h4>
                            ${s.description ? `<p class="schedule-desc">${escapeHtml(s.description)}</p>` : ''}
                        </div>
                        <div class="meta-list">
                            <div class="meta-item">
                                <i class="fa-regular fa-calendar"></i>
                                <span>${formatDate(s.event_date)}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fa-regular fa-clock"></i>
                                <span>${timeText}</span>
                            </div>
                            ${s.location ? `
                                <div class="meta-item">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <span>${escapeHtml(s.location)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchSchedules() {
            const container = document.getElementById('scheduleList');
            const { data, error } = await supabaseClient
                .from('schedules')
                .select('*')
                .eq('user_id', currentUserId)
                .order('event_date', { ascending: true })
                .order('start_time', { ascending: true });

            if (error) {
                container.innerHTML = `<p style="color:#dc2626; font-size:0.9rem;">${escapeHtml(error.message)}</p>`;
                return;
            }

            allSchedules = data || [];
            updateLayoutState();
            renderSchedules();
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.top.location.href = '../auth.html';
                return;
            }
            currentUserId = session.user.id;

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('schedDate').value = todayStr;
            document.getElementById('modalSchedDate').value = todayStr;

            fetchSchedules();
        })();
    </script>
</body>

</html>
