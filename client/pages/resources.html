<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-blue: #0f2b4c;
            --accent-gold: #f59e0b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--primary-dark);
            background: var(--off-white);
            line-height: 1.5;
            padding-bottom: max(120px, calc(80px + env(safe-area-inset-bottom)));
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
        }

        .page-body {
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .page-body {
                padding: 1rem;
            }
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 0.45rem 1.1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            color: var(--text-gray);
            background: #fff;
            transition: var(--transition);
        }

        .filter-tab:hover {
            border-color: var(--primary-dark);
            color: var(--primary-dark);
        }

        .filter-tab.active {
            background: var(--primary-dark);
            color: #fff;
            border-color: var(--primary-dark);
        }

        /* Grid */
        .resource-public-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        @media (max-width: 576px) {
            .resource-public-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.75rem;
            }
        }

        /* Book Card Style */
        .book-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 3px 10px rgba(10, 25, 47, 0.05);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(10, 25, 47, 0.1);
        }

        /* Half-Height Cover Container */
        .book-cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 0.7;
            background: #0f2b4c;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .book-cover-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: none;
        }

        .book-cover-placeholder {
            width: 100%;
            height: 100%;
            padding: 0.5rem;
            background: linear-gradient(135deg, #0a192f 0%, #1e3a8a 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .book-cover-placeholder i {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 0.3rem;
        }

        .book-cover-placeholder span {
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Bottom Footer */
        .book-details {
            padding: 0.65rem 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            border-top: 1px solid #f1f5f9;
            flex-grow: 1;
        }

        .book-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            margin-bottom: 0.2rem;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .download-btn {
            background: #fff3e0;
            color: #d97706;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
            font-size: 0.75rem;
        }

        .download-btn:hover {
            background: var(--accent-gold);
            color: #fff;
            transform: scale(1.08);
        }

        .book-date {
            font-size: 0.68rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        .empty-msg {
            color: var(--text-gray);
            font-size: 0.9rem;
            text-align: center;
            padding: 3rem;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>
    <main class="page-body">
        <!-- Modified Filter Tabs -->
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All</div>
            <div class="filter-tab" data-filter="lesson" onclick="setFilter('lesson')">Lessons</div>
            <div class="filter-tab" data-filter="mission_story" onclick="setFilter('mission_story')">Mission Story</div>
            <div class="filter-tab" data-filter="bible_study_guide" onclick="setFilter('bible_study_guide')">Bible Study
                Guide</div>
            <div class="filter-tab" data-filter="egw_collection" onclick="setFilter('egw_collection')">Ellen G. White
                Collection</div>
        </div>

        <div class="resource-public-grid" id="resourcePublicGrid">
            <p class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading resources...</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const categoryLabels = {
            lesson: 'Lessons',
            mission_story: 'Mission Story',
            bible_study_guide: 'Bible Study Guide',
            egw_collection: 'Ellen G. White Collection'
        };

        let allResources = [];
        let currentFilter = 'all';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === cat));
            renderResources();
        }

        async function triggerDownload(event, fileUrl, fileName) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (!fileUrl) {
                alert('File link unavailable.');
                return;
            }

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = fileName || 'download';
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                window.URL.revokeObjectURL(downloadUrl);
            } catch (err) {
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName || 'download';
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        async function renderPdfCover(pdfUrl, canvasId) {
            if (!window.pdfjsLib || !pdfUrl) return;
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1);

                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const context = canvas.getContext('2d');

                const viewport = page.getViewport({ scale: 0.6 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;
                canvas.style.display = 'block';

                const placeholder = document.getElementById(`placeholder-${canvasId}`);
                if (placeholder) placeholder.style.display = 'none';
            } catch (err) {
                console.warn('PDF thumbnail render skipped or failed:', err);
            }
        }

        function renderResources() {
            const container = document.getElementById('resourcePublicGrid');

            const items = currentFilter === 'all'
                ? allResources
                : allResources.filter(r => {
                    if (!r.category) return false;
                    const cat = r.category.toLowerCase().trim();
                    const filter = currentFilter.toLowerCase().trim();

                    return cat === filter ||
                        (filter === 'egw_collection' && (cat.includes('ellen') || cat.includes('egw') || cat.includes('white'))) ||
                        (filter === 'mission_story' && (cat.includes('mission') || cat.includes('story')));
                });

            if (items.length === 0) {
                container.innerHTML = '<p class="empty-msg">No resources found in this category yet.</p>';
                return;
            }

            container.innerHTML = items.map((r, index) => {
                const title = escapeHtml(r.title || 'Untitled');
                const coverUrl = r.cover_url || r.image_url || r.thumbnail_url || r.cover_image || r.photo_url || null;
                const fileUrl = r.file_url || '';

                const isImageFile = fileUrl.match(/\.(jpeg|jpg|gif|png|webp|svg)($|\?)/i);
                const displayImage = coverUrl || (isImageFile ? fileUrl : null);

                const canvasId = `pdf-canvas-${index}`;
                const formattedDate = formatDate(r.created_at);

                return `
                    <div class="book-card">
                        <div class="book-cover-wrap">
                            ${displayImage ? `
                                <img src="${escapeHtml(displayImage)}" alt="${title}" class="book-cover-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="book-cover-placeholder" style="display:none;">
                                    <i class="fa-solid fa-book-open"></i>
                                    <span>${title}</span>
                                </div>
                            ` : `
                                <canvas id="${canvasId}" class="book-cover-canvas"></canvas>
                                <div class="book-cover-placeholder" id="placeholder-${canvasId}">
                                    <i class="fa-solid fa-book-open"></i>
                                    <span>${title}</span>
                                </div>
                            `}
                        </div>

                        <div class="book-details">
                            <div class="book-title-row">
                                <div class="book-title" title="${title}">${title}</div>
                                <button type="button" class="download-btn" title="Download Resource" onclick="triggerDownload(event, '${escapeHtml(fileUrl)}', '${escapeHtml(r.title)}')">
                                    <i class="fa-solid fa-download"></i>
                                </button>
                            </div>
                            <div class="book-date">${formattedDate}</div>
                        </div>
                    </div>
                `;
            }).join('');

            items.forEach((r, index) => {
                const coverUrl = r.cover_url || r.image_url || r.thumbnail_url || r.cover_image || r.photo_url || null;
                const fileUrl = r.file_url || '';
                const isImageFile = fileUrl.match(/\.(jpeg|jpg|gif|png|webp|svg)($|\?)/i);

                if (!coverUrl && !isImageFile && fileUrl) {
                    const canvasId = `pdf-canvas-${index}`;
                    renderPdfCover(fileUrl, canvasId);
                }
            });
        }

        async function loadResources() {
            const { data, error } = await supabaseClient.from('resources').select('*').order('created_at', { ascending: false });
            if (error) {
                document.getElementById('resourcePublicGrid').innerHTML = `<p class="empty-msg">Could not load resources: ${escapeHtml(error.message)}</p>`;
                return;
            }
            allResources = data || [];
            renderResources();
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.top.location.href = '../auth.html';
                return;
            }
            loadResources();
        })();
    </script>
</body>

</html>
