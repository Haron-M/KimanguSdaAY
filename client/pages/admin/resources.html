<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-blue: #0f2b4c;
            --accent-gold: #f59e0b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--primary-dark);
            background: var(--off-white);
            line-height: 1.6;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Playfair Display', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page-body {
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .page-body {
                padding: 1.2rem;
            }
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        .admin-form-card,
        .admin-list-card {
            background: #fff;
            border-radius: 14px;
            padding: 1.6rem;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.05);
            border: 1px solid var(--border-color);
        }

        .admin-form-card h3,
        .admin-list-card h3 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--primary-dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fff;
        }

        .file-drop {
            border: 1.5px dashed var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-gray);
            cursor: pointer;
            position: relative;
        }

        .file-drop i {
            font-size: 1.3rem;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 0.4rem;
        }

        .file-drop input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-preview-name {
            font-size: 0.8rem;
            color: var(--primary-dark);
            margin-top: 0.5rem;
            font-weight: 600;
        }

        /* Dynamic Upload Progress Bar */
        .progress-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 0.8rem;
            height: 18px;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-gold);
            color: var(--primary-dark);
            font-size: 0.72rem;
            font-weight: 700;
            text-align: center;
            line-height: 18px;
            transition: width 0.15s linear;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-dark);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.8rem;
        }

        .btn-submit:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-msg {
            font-size: 0.85rem;
            margin-bottom: 1rem;
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            display: none;
        }

        .form-msg.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            color: #15803d;
        }

        .form-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        /* Category Section Partitioning */
        .category-section {
            margin-bottom: 1.8rem;
        }

        .category-section:last-child {
            margin-bottom: 0;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .category-header h4 {
            font-size: 1rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .category-count {
            font-size: 0.8rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        .category-empty {
            font-size: 0.82rem;
            color: var(--text-gray);
            font-style: italic;
            padding: 0.3rem 0;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.8rem;
        }

        .resource-card-mini {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            box-shadow: 0 2px 6px rgba(10, 25, 47, 0.03);
            transition: var(--transition);
        }

        .resource-card-mini:hover {
            border-color: var(--primary-dark);
        }

        .resource-mini-title {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-dark);
            overflow: hidden;
            white-space: nowrap;
        }

        .resource-mini-title span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .resource-delete-btn-mini {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .resource-delete-btn-mini:hover {
            background: #dc2626;
            color: #fff;
        }

        .btn-see-more {
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--primary-blue);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.6rem;
            display: inline-block;
        }

        .btn-see-more:hover {
            background: var(--off-white);
            border-color: var(--primary-blue);
        }

        @media (max-width: 900px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="page-body">
        <div class="admin-grid">
            <!-- Upload Form -->
            <div class="admin-form-card">
                <h3>Upload Resource</h3>
                <div class="form-msg" id="formMsg"></div>

                <form id="resourceForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="resTitle" placeholder="e.g. Q4 Sabbath School Guide" required>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select id="resCategory" required>
                            <option value="lesson">Lesson</option>
                            <option value="mission_story">Mission Story</option>
                            <option value="bible_study_guide">Bible Study Guide</option>
                            <option value="egw_collection">Ellen G. White Collection</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Document File</label>
                        <div class="file-drop" id="fileDrop">
                            <i class="fa-solid fa-file-arrow-up"></i>
                            Click to upload document
                            <input type="file" id="resFile" accept=".pdf,.doc,.docx,.ppt,.pptx" required>
                        </div>
                        <div class="file-preview-name" id="resFileName"></div>

                        <!-- Progress Bar -->
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar">0%</div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submitResBtn">Upload Resource</button>
                </form>
            </div>

            <!-- Categorized Resources List -->
            <div class="admin-list-card">
                <h3>All Resources</h3>
                <div id="resourceGrid">
                    <p style="color:var(--text-gray,#64748b); font-size:0.9rem;">Loading resources...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://hywlfxlvwqnqbsmrmcbl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1rkSNVU_Dl2j4l2jHgD7aA_3LGqEPbd';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        document.getElementById('resFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            document.getElementById('resFileName').textContent = file ? file.name : '';
        });

        function showMsg(text, type) {
            const el = document.getElementById('formMsg');
            el.textContent = text;
            el.className = `form-msg ${type}`;
        }

        // XHR Upload function to capture accurate real-time progress
        function uploadFileWithXHR(file, filePath, accessToken) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const uploadUrl = `${SUPABASE_URL}/storage/v1/object/resource-files/${filePath}`;

                xhr.open('POST', uploadUrl, true);
                xhr.setRequestHeader('apikey', SUPABASE_KEY);
                xhr.setRequestHeader('Authorization', `Bearer ${accessToken}`);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                const progressContainer = document.getElementById('progressContainer');
                const progressBar = document.getElementById('progressBar');

                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressBar.textContent = percent + '%';
                    }
                };

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve();
                    } else {
                        try {
                            const err = JSON.parse(xhr.responseText);
                            reject(new Error(err.message || err.error || 'Upload failed'));
                        } catch (e) {
                            reject(new Error('Upload failed with status ' + xhr.status));
                        }
                    }
                };

                xhr.onerror = () => reject(new Error('Network error during file upload.'));
                xhr.send(file);
            });
        }

        // Upload Form Submission
        document.getElementById('resourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitResBtn');
            const file = document.getElementById('resFile').files[0];
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            if (!file) { showMsg('Please choose a document to upload.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Uploading...';
            showMsg('', '');

            // Reset and display progress bar
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) throw new Error('User session expired. Please log in again.');

                const title = document.getElementById('resTitle').value.trim();
                const category = document.getElementById('resCategory').value;
                const filePath = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

                // 1. Upload via XHR for real-time progress updates
                await uploadFileWithXHR(file, filePath, session.access_token);

                // 2. Get Public URL
                const { data: publicUrlData } = supabaseClient.storage.from('resource-files').getPublicUrl(filePath);

                // 3. Insert record into Supabase Database
                const { error: insertError } = await supabaseClient.from('resources').insert({
                    title, category, file_url: publicUrlData.publicUrl
                });

                if (insertError) throw new Error(insertError.message);

                showMsg('Resource uploaded successfully!', 'success');
                document.getElementById('resourceForm').reset();
                document.getElementById('resFileName').textContent = '';
                loadResources();
            } catch (err) {
                showMsg(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload Resource';
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    progressBar.style.width = '0%';
                }, 1500);
            }
        });

        async function deleteResource(id) {
            if (!confirm('Delete this resource?')) return;
            const { error } = await supabaseClient.from('resources').delete().eq('id', id);
            if (error) { alert('Could not delete: ' + error.message); return; }
            loadResources();
        }

        function toggleSeeMore(catKey, extraCount) {
            const extraItems = document.querySelectorAll(`.cat-extra-${catKey}`);
            const btn = document.getElementById(`see-more-btn-${catKey}`);
            if (!btn) return;

            const isExpanded = btn.getAttribute('data-expanded') === 'true';
            if (isExpanded) {
                extraItems.forEach(el => el.style.display = 'none');
                btn.textContent = `See More (${extraCount} more)`;
                btn.setAttribute('data-expanded', 'false');
            } else {
                extraItems.forEach(el => el.style.display = 'flex');
                btn.textContent = 'See Less';
                btn.setAttribute('data-expanded', 'true');
            }
        }

        async function loadResources() {
            const container = document.getElementById('resourceGrid');
            const { data, error } = await supabaseClient.from('resources').select('*').order('created_at', { ascending: false });
            if (error) {
                container.innerHTML = `<p style="color:#dc2626; font-size:0.9rem;">${escapeHtml(error.message)}</p>`;
                return;
            }

            const categories = [
                { key: 'lesson', label: 'Lessons' },
                { key: 'mission_story', label: 'Mission Story' },
                { key: 'bible_study_guide', label: 'Bible Study Guide' },
                { key: 'egw_collection', label: 'Ellen G. White Collection' }
            ];

            const grouped = {
                lesson: [],
                mission_story: [],
                bible_study_guide: [],
                egw_collection: []
            };

            if (data && data.length > 0) {
                data.forEach(item => {
                    const cat = (item.category || '').toLowerCase().trim();
                    if (grouped[cat]) {
                        grouped[cat].push(item);
                    } else if (cat.includes('ellen') || cat.includes('egw') || cat.includes('white')) {
                        grouped['egw_collection'].push(item);
                    } else if (cat.includes('mission') || cat.includes('story')) {
                        grouped['mission_story'].push(item);
                    } else if (cat.includes('bible') || cat.includes('guide')) {
                        grouped['bible_study_guide'].push(item);
                    } else {
                        grouped['lesson'].push(item);
                    }
                });
            }

            let html = '';

            categories.forEach(catObj => {
                const items = grouped[catObj.key] || [];
                html += `<div class="category-section">`;
                html += `
            <div class="category-header">
                <h4>${catObj.label}</h4>
                <span class="category-count">${items.length} ${items.length === 1 ? 'file' : 'files'}</span>
            </div>
        `;

                if (items.length === 0) {
                    html += `<p class="category-empty">No files in this category yet.</p>`;
                } else {
                    html += `<div class="category-grid">`;
                    items.forEach((r, idx) => {
                        const isHidden = idx >= 3;
                        const displayStyle = isHidden ? 'style="display: none;"' : '';
                        const extraClass = isHidden ? `cat-extra-${catObj.key}` : '';

                        html += `
                    <div class="resource-card-mini ${extraClass}" ${displayStyle}>
                        <div class="resource-mini-title" title="${escapeHtml(r.title)}">
                            <i class="fa-solid fa-file-pdf" style="color: #f59e0b; margin-right: 8px;"></i>
                            <span>${escapeHtml(r.title)}</span>
                        </div>
                        <button type="button" class="resource-delete-btn-mini" onclick="deleteResource('${r.id}')" title="Delete Resource">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                    });
                    html += `</div>`;

                    if (items.length > 3) {
                        const extraCount = items.length - 3;
                        html += `
                    <button type="button" id="see-more-btn-${catObj.key}" class="btn-see-more" data-expanded="false" onclick="toggleSeeMore('${catObj.key}', ${extraCount})">
                        See More (${extraCount} more)
                    </button>
                `;
                    }
                }

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.top.location.href = '../../auth.html'; return; }
            loadResources();
        })();
    </script>
</body>

</html>
