<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new</title>
    <style>
        /* ===== Ask AI floating button + panel ===== */
        .ai-fab {
            position: fixed;
            right: 18px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            z-index: 4000;
            width: 84px;
            height: 84px;
            border: none;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fbbf24, #f59e0b 60%, #d97706);
            color: #0a192f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 22px rgba(217, 119, 6, 0.45);
            transition: transform 0.2s ease;
        }

        .ai-fab:hover {
            transform: scale(1.06);
        }

        .ai-fab i {
            font-size: 1.5rem;
        }

        .ai-fab span {
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .ai-fab.hidden {
            display: none;
        }

        .ai-panel {
            position: fixed;
            right: 18px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            z-index: 4001;
            width: 380px;
            height: min(580px, calc(100dvh - 40px));
            background: #fff;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 50px rgba(10, 25, 47, 0.28);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-panel.open {
            display: flex;
        }

        .ai-head {
            background: #0a192f;
            color: #fff;
            padding: 0.9rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .ai-head-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f59e0b;
            color: #0a192f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-head h4 {
            margin: 0;
            font-size: 0.95rem;
        }

        .ai-head p {
            margin: 0;
            font-size: 0.72rem;
            color: #cbd5e1;
        }

        .ai-head-actions {
            margin-left: auto;
            display: flex;
            gap: 0.3rem;
        }

        .ai-head-actions button {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .ai-head-actions button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .ai-msg {
            max-width: 86%;
            padding: 0.65rem 0.9rem;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-msg.user {
            align-self: flex-end;
            background: #0a192f;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .ai-msg.bot {
            align-self: flex-start;
            background: #fff;
            color: #0a192f;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .ai-msg.error {
            border-color: #fecaca;
            color: #b91c1c;
        }

        .ai-typing::after {
            content: '▍';
            animation: aiBlink 1s steps(2) infinite;
        }

        @keyframes aiBlink {
            50% {
                opacity: 0;
            }
        }

        .ai-suggest {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .ai-suggest button {
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #0a192f;
            font-family: inherit;
            font-size: 0.78rem;
            border-radius: 20px;
            padding: 0.35rem 0.8rem;
            cursor: pointer;
        }

        .ai-suggest button:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: #f59e0b;
        }

        .ai-input-row {
            display: flex;
            gap: 0.5rem;
            padding: 0.7rem;
            border-top: 1px solid #e2e8f0;
            background: #fff;
        }

        .ai-input-row textarea {
            flex: 1;
            resize: none;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.6rem 0.8rem;
            font-family: inherit;
            font-size: 0.9rem;
            max-height: 96px;
            outline: none;
        }

        .ai-input-row textarea:focus {
            border-color: #f59e0b;
        }

        .ai-send {
            width: 42px;
            border: none;
            border-radius: 12px;
            background: #f59e0b;
            color: #0a192f;
            cursor: pointer;
            font-size: 1rem;
        }

        .ai-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .ai-fab {
                width: 70px;
                height: 70px;
                right: 12px;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            }

            .ai-fab i {
                font-size: 1.25rem;
            }

            .ai-panel {
                right: 0;
                left: 0;
                bottom: 0;
                width: 100%;
                height: 100dvh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Ask AI -->
    <button type="button" class="ai-fab" id="aiFab" aria-label="Ask AI">
        <i class="fa-solid fa-comment-dots"></i>
        <span>ASK AI</span>
    </button>

    <section class="ai-panel" id="aiPanel" aria-label="Ask AI chat">
        <div class="ai-head">
            <div class="ai-head-icon"><i class="fa-solid fa-comment-dots"></i></div>
            <div>
                <h4>Ask AI</h4>
                <p>Kimangu AY assistant</p>
            </div>
            <div class="ai-head-actions">
                <button type="button" id="aiClear" title="Clear chat"><i class="fa-solid fa-trash-can"></i></button>
                <button type="button" id="aiClose" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="ai-messages" id="aiMessages"></div>
        <div class="ai-input-row">
            <textarea id="aiInput" rows="1" placeholder="Ask me anything…" maxlength="2000"></textarea>
            <button type="button" class="ai-send" id="aiSend" aria-label="Send"><i
                    class="fa-solid fa-paper-plane"></i></button>
        </div>
    </section>
    <script>
        // ===================== ASK AI CHAT =====================
        const aiFab = document.getElementById('aiFab');
        const aiPanel = document.getElementById('aiPanel');
        const aiMessages = document.getElementById('aiMessages');
        const aiInput = document.getElementById('aiInput');
        const aiSend = document.getElementById('aiSend');
        let aiLoaded = false;
        let aiBusy = false;

        const AI_SUGGESTIONS = ['What events are coming up?', 'Give me a Bible verse for today', 'How do I make a payment?'];

        function aiAddMessage(role, text, extraClass = '') {
            const el = document.createElement('div');
            el.className = `ai-msg ${role} ${extraClass}`.trim();
            el.textContent = text;
            aiMessages.appendChild(el);
            aiMessages.scrollTop = aiMessages.scrollHeight;
            return el;
        }

        function aiShowWelcome() {
            aiMessages.innerHTML = '';
            aiAddMessage('bot', `Hi${greetingName ? ' ' + greetingName : ''}! I'm your Kimangu AY assistant. How can I help?`);
            const wrap = document.createElement('div');
            wrap.className = 'ai-suggest';
            AI_SUGGESTIONS.forEach(q => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = q;
                b.addEventListener('click', () => { aiInput.value = q; aiSendMessage(); });
                wrap.appendChild(b);
            });
            aiMessages.appendChild(wrap);
        }

        async function aiLoadHistory() {
            if (aiLoaded) return;
            aiLoaded = true;
            try {
                const rows = await api('/api/ai/history');
                if (Array.isArray(rows) && rows.length) {
                    aiMessages.innerHTML = '';
                    rows.forEach(r => aiAddMessage(r.role === 'user' ? 'user' : 'bot', r.content));
                    return;
                }
            } catch (err) { /* fall through to welcome */ }
            aiShowWelcome();
        }

        function aiOpen() {
            aiPanel.classList.add('open');
            aiFab.classList.add('hidden');
            aiLoadHistory();
            setTimeout(() => aiInput.focus(), 50);
        }

        function aiClose() {
            aiPanel.classList.remove('open');
            aiFab.classList.remove('hidden');
        }

        // Streams the reply from the server (api() only handles JSON, so this uses fetch directly)
        async function aiStreamReply(message, retry = true) {
            const res = await fetch(`${API_BASE}/api/ai/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
                body: JSON.stringify({ message })
            });

            if (res.status === 401) {
                if (retry && await refreshSession()) return aiStreamReply(message, false);
                clearSession();
                goToLogin();
                throw new Error('Session expired');
            }
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || 'The assistant is unavailable right now.');
            }
            return res;
        }

        async function aiSendMessage() {
            const text = aiInput.value.trim();
            if (!text || aiBusy) return;

            aiBusy = true;
            aiSend.disabled = true;
            aiInput.value = '';
            aiInput.style.height = 'auto';

            const suggest = aiMessages.querySelector('.ai-suggest');
            if (suggest) suggest.remove();

            aiAddMessage('user', text);
            const bot = aiAddMessage('bot', '', 'ai-typing');

            try {
                const res = await aiStreamReply(text);
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let reply = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    reply += decoder.decode(value, { stream: true });
                    bot.textContent = reply;
                    aiMessages.scrollTop = aiMessages.scrollHeight;
                }
                if (!reply.trim()) bot.textContent = 'I could not come up with a reply. Please try again.';
            } catch (err) {
                bot.textContent = err.message || 'Something went wrong. Please try again.';
                bot.classList.add('error');
            } finally {
                bot.classList.remove('ai-typing');
                aiBusy = false;
                aiSend.disabled = false;
                aiInput.focus();
            }
        }

        aiFab.addEventListener('click', aiOpen);
        document.getElementById('aiClose').addEventListener('click', aiClose);
        aiSend.addEventListener('click', aiSendMessage);

        aiInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                aiSendMessage();
            }
        });
        aiInput.addEventListener('input', () => {
            aiInput.style.height = 'auto';
            aiInput.style.height = Math.min(aiInput.scrollHeight, 96) + 'px';
        });

        document.getElementById('aiClear').addEventListener('click', async () => {
            if (aiBusy || !confirm('Clear your chat history?')) return;
            try {
                await api('/api/ai/history', { method: 'DELETE' });
                aiShowWelcome();
            } catch (err) {
                aiAddMessage('bot', 'Could not clear the chat. Please try again.', 'error');
            }
        });

    </script>

</body>

</html>
